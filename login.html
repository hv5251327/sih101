<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI Officer Portal Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #1e3a8a; --primary-hover: #172554; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 440px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 0.85rem; color: var(--muted); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .footer-links { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="header">
    <i class="fa-solid fa-user-tie" style="font-size: 2.4rem; color: var(--primary); margin-bottom: 8px;"></i>
    <h2>MoSPI Officer Portal</h2>
    <p>Statistical Officer Authentication</p>
  </div>
  <form id="login-form">
    <div class="form-group">
      <label for="login_email">Government Email ID</label>
      <input type="email" id="login_email" class="form-control" placeholder="officer@gov.in" required>
    </div>
    <div class="form-group">
      <label for="login_password">Password</label>
      <input type="password" id="login_password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard</button>
  </form>
  <div class="footer-links">
    New Officer? <a href="register.html">Register here</a>
  </div>
</div>
<script>
document.getElementById("login-form").onsubmit = function(e) {
  e.preventDefault();
  const email = document.getElementById("login_email").value.trim().toLowerCase();
  const password = document.getElementById("login_password").value.trim();

  fetch("http://127.0.0.1:5000/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  }).then(r => r.json()).then(d => {
    if (d.status === "success" && d.user) {
      localStorage.setItem("mospi_user", email);
      localStorage.setItem("mospi_user_role", "officer");
      localStorage.setItem("mospi_user_name", d.user.name);
      localStorage.setItem("mospi_registered_designation", d.user.designation);
      localStorage.setItem("mospi_registered_department", d.user.department);
      window.location.href = "dashboard.html";
    } else {
      alert(d.message || "Invalid officer credentials.");
    }
  }).catch(() => {
    localStorage.setItem("mospi_user", email);
    localStorage.setItem("mospi_user_role", "officer");
    window.location.href = "dashboard.html";
  });
  return false;
};
</script>
</body>
</html>

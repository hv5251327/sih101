<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | MoSPI iGOT Karmayogi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #15325b; --accent: #e58a2b; --bg: #f8fafc; --card: #ffffff; --border: #cbd5e1; --text: #1e293b; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .top-strip { background: #0d213a; color: #f1f5f9; padding: 8px 36px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
    .auth-card { background: var(--card); width: 100%; max-width: 420px; border-radius: 16px; padding: 32px 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; font-size: 18px; font-weight: 800; color: var(--primary); }
    .brand i { font-size: 30px; color: var(--accent); }
    .tabs { display: flex; background: #f1f5f9; border-radius: 8px; padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; color: var(--muted); }
    .tab.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .group { margin-bottom: 16px; }
    .label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .field { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; }
    .field:focus { border-color: var(--primary); }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn:hover { background: #0e223f; }
  </style>
</head>
<body>
  <div class="top-strip">
    <div><i class="fa-solid fa-flag"></i> Government of India | MoSPI Capacity Building</div>
    <div>National Statistical Systems Training Academy (NSSTA)</div>
  </div>

  <div class="main">
    <div class="auth-card">
      <div class="brand">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>MoSPI iGOT Intelligence</span>
      </div>

      <div class="tabs">
        <div class="tab active" id="tabOfficer" onclick="switchRole('officer')">Officer Sign In</div>
        <div class="tab" id="tabAdmin" onclick="switchRole('admin')">Admin Console</div>
      </div>

      <form onsubmit="handleAuth(event)">
        <div class="group">
          <label class="label">Official Email ID</label>
          <input type="email" id="email" class="field" value="harsha@gov.in" required>
        </div>
        <div class="group">
          <label class="label">Password / Security PIN</label>
          <input type="password" id="password" class="field" value="1234" required>
        </div>
        <button type="submit" id="btnAuth" class="btn">Sign In to Dashboard</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = "https://sih101.onrender.com";
    let activeRole = 'officer';

    function switchRole(role) {
      activeRole = role;
      if (role === 'admin') {
        document.getElementById('tabAdmin').classList.add('active');
        document.getElementById('tabOfficer').classList.remove('active');
        document.getElementById('email').value = '123@gov.ac.in';
        document.getElementById('password').value = '1234';
        document.getElementById('btnAuth').textContent = 'Access Administration Console';
      } else {
        document.getElementById('tabOfficer').classList.add('active');
        document.getElementById('tabAdmin').classList.remove('active');
        document.getElementById('email').value = 'harsha@gov.in';
        document.getElementById('password').value = '1234';
        document.getElementById('btnAuth').textContent = 'Sign In to Dashboard';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('btnAuth');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      if (email.toLowerCase() === '123@gov.ac.in' && password === '1234') {
        const adminUser = { id: 999, name: "Chief Administrator", email: "123@gov.ac.in", role: "admin", completed_modules: [1, 2, 3], competency_score: "100%" };
        localStorage.setItem("mospi_user", JSON.stringify(adminUser));
        window.location.href = "admin.html";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.status === "success") {
          localStorage.setItem("mospi_user", JSON.stringify(data.user));
          window.location.href = data.user.role === 'admin' ? "admin.html" : "dashboard.html";
          return;
        }
      } catch (err) {}

      const officerObj = {
        name: email.split('@')[0],
        email: email,
        department: "National Accounts Division (NAD)",
        designation: "Deputy Director (ISS)",
        cadre: "Indian Statistical Service (ISS)",
        role: "employee",
        competency_score: "75%",
        completed_modules: [1, 2]
      };
      localStorage.setItem("mospi_user", JSON.stringify(officerObj));
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>

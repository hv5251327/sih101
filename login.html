<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI & NSSTA Portal Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 440px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 0.85rem; color: var(--muted); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
    .form-control:focus { border-color: var(--primary); }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-submit:hover { background: var(--primary-hover); }
    .footer-links { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="header">
    <i class="fa-solid fa-shield-halved" style="font-size: 2.2rem; color: var(--primary); margin-bottom: 8px;"></i>
    <h2>MoSPI Officer Login</h2>
    <p>Sign in to access your 4-Pillar Competency Dashboard</p>
  </div>

  <form id="login-form">
    <div class="form-group">
      <label for="login_email">Government Email ID</label>
      <input type="email" id="login_email" class="form-control" placeholder="e.g. officer@gov.in" required>
    </div>

    <div class="form-group">
      <label for="login_password">Password</label>
      <input type="password" id="login_password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard</button>
  </form>

  <div class="footer-links">
    New Officer? <a href="register.html">Register here</a>
  </div>
</div>

<script>
document.getElementById("login-form").onsubmit = async function(e) {
  e.preventDefault();
  const btn = document.querySelector(".btn-submit");
  if (btn) { btn.disabled = true; btn.innerText = "Authenticating..."; }

  const email = document.getElementById("login_email").value.trim().toLowerCase();
  const password = document.getElementById("login_password").value.trim();

  try {
    const res = await fetch("http://127.0.0.1:5000/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password })
    });
    const data = await res.json();

    if (res.status === 200 && data.status === "success") {
      localStorage.setItem("mospi_user", data.user.email);
      localStorage.setItem("mospi_user_name", data.user.name);
      localStorage.setItem("mospi_registered_ministry", data.user.department);
      localStorage.setItem("mospi_registered_designation", data.user.designation);

      const desig = data.user.designation || "";
      let cadre = "Subordinate Statistical Service (SSS)";
      if (desig.includes("ISS") || desig.includes("Director General") || desig.includes("Director (") || desig.includes("Assistant Director")) {
        cadre = "Indian Statistical Service (ISS)";
      } else if (desig.includes("DES") || desig.includes("State") || desig.includes("District")) {
        cadre = "State DES Statistical Cadre";
      }
      localStorage.setItem("mospi_registered_cadre", cadre);

      window.location.href = "dashboard.html";
      return false;
    } else {
      alert(data.message || "Invalid credentials. Please check your email and password.");
      if (btn) { btn.disabled = false; btn.innerText = "Sign In to Dashboard"; }
    }
  } catch(err) {
    alert("Backend server is not reachable. Please ensure python app_api.py is running on port 5000.");
    if (btn) { btn.disabled = false; btn.innerText = "Sign In to Dashboard"; }
  }
  return false;
};
</script>
</body>
</html>

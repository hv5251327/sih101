<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI Admin Portal Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #7c3aed; --primary-hover: #6d28d9; --bg: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%); --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: var(--card); border-radius: 12px; width: 100%; max-width: 440px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 0.85rem; color: var(--muted); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .footer-links { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="header">
    <i class="fa-solid fa-user-shield" style="font-size: 2.8rem; color: var(--primary); margin-bottom: 10px;"></i>
    <h2>Admin Command Center</h2>
    <p>MoSPI & NSSTA Administrator Portal</p>
  </div>
  <form id="admin-login-form">
    <div class="form-group">
      <label for="admin_email">Admin Email ID</label>
      <input type="email" id="admin_email" class="form-control" placeholder="admin@gmail.com" value="admin@gmail.com" required>
    </div>
    <div class="form-group">
      <label for="admin_password">Admin Password</label>
      <input type="password" id="admin_password" class="form-control" placeholder="••••" required>
    </div>
    <button type="submit" class="btn-submit"><i class="fa-solid fa-shield-halved"></i> Sign In to Admin Portal</button>
  </form>
  <div class="footer-links">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  </div>
</div>
<script>
document.getElementById("admin-login-form").onsubmit = function(e) {
  e.preventDefault();
  const email = document.getElementById("admin_email").value.trim().toLowerCase();
  const password = document.getElementById("admin_password").value.trim();

  if (email === "admin@gmail.com" && password === "1234") {
    localStorage.setItem("mospi_user", email);
    localStorage.setItem("mospi_user_role", "admin");
    window.location.href = "admin.html";
    return false;
  }

  fetch("http://127.0.0.1:5000/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  }).then(r => r.json()).then(d => {
    if (d.status === "success" && d.role === "admin") {
      localStorage.setItem("mospi_user", email);
      localStorage.setItem("mospi_user_role", "admin");
      window.location.href = "admin.html";
    } else {
      alert("Invalid Admin Credentials. Use admin@gmail.com and 1234.");
    }
  }).catch(() => {
    alert("Server offline. Check if python app_api.py is running.");
  });
  return false;
};
</script>
</body>
</html>

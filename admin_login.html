<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI Admin Portal Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #7c3aed; --primary-hover: #6d28d9; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 440px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 0.85rem; color: var(--muted); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .footer-links { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 700; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.85rem; display: none; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="header">
    <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: var(--primary); margin-bottom: 12px;"></i>
    <h2>Admin Command Center</h2>
    <p>MoSPI & NSSTA Administrator Portal</p>
  </div>
  
  <div id="alert-box" class="alert"></div>

  <form id="admin-login-form">
    <div class="form-group">
      <label for="admin_email">Admin Email ID</label>
      <input type="email" id="admin_email" class="form-control" value="admin@mospi.gov.in" required>
    </div>
    <div class="form-group">
      <label for="admin_password">Admin Password</label>
      <input type="password" id="admin_password" class="form-control" placeholder="Enter admin password" required>
    </div>
    <button type="submit" class="btn-submit"><i class="fa-solid fa-shield-halved"></i> Access Admin Portal</button>
  </form>
  <div class="footer-links">
    <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Officer Login</a>
  </div>
</div>
<script>
function showAlert(message, type) {
  const alertBox = document.getElementById("alert-box");
  alertBox.textContent = message;
  alertBox.className = `alert alert-${type}`;
  alertBox.style.display = "block";
  setTimeout(() => { alertBox.style.display = "none"; }, 5000);
}

document.getElementById("admin-login-form").onsubmit = async function(e) {
  e.preventDefault();
  const email = document.getElementById("admin_email").value.trim().toLowerCase();
  const password = document.getElementById("admin_password").value.trim();

  // Direct admin check
  if (email === "admin@mospi.gov.in" && password === "admin123") {
    localStorage.setItem("mospi_user", "admin@mospi.gov.in");
    localStorage.setItem("mospi_user_role", "admin");
    showAlert("Admin authentication successful! Redirecting...", "success");
    setTimeout(() => { window.location.href = "admin.html"; }, 1000);
    return false;
  }

  // Verify with backend
  try {
    const response = await fetch("http://127.0.0.1:5000/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password })
    });

    const data = await response.json();

    if (data.status === "success" && data.role === "admin") {
      localStorage.setItem("mospi_user", email);
      localStorage.setItem("mospi_user_role", "admin");
      showAlert("Admin login successful! Redirecting...", "success");
      setTimeout(() => { window.location.href = "admin.html"; }, 1000);
    } else {
      showAlert("Invalid admin credentials. Access denied.", "error");
    }
  } catch (error) {
    showAlert("Server connection error. Please ensure backend is running.", "error");
    console.error("Admin login error:", error);
  }
  return false;
};
</script>
</body>
</html>

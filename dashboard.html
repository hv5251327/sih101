<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI & NSSTA Officer Learning Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .bhashini-bar { display: flex; align-items: center; gap: 10px; background: #f1f5f9; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .pillar-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .progress-bar-bg { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin: 10px 0 6px 0; }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; }
    .video-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .video-frame { width: 100%; height: 200px; background: #000; border: none; }
    .video-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .upload-zone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 12px; text-align: center; margin-top: 12px; background: #f8fafc; cursor: pointer; transition: border-color 0.2s; }
    .upload-zone:hover { border-color: var(--primary-light); background: #f0f9ff; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header with Bhashini API Language Selector (No Switch Role Button) -->
  <div class="header">
    <div>
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 4px;">
        <h2 id="officer-name" style="font-size: 1.35rem; font-weight: 800;">Officer Dashboard</h2>
        <span id="officer-cadre" class="badge">ISS Cadre</span>
      </div>
      <p id="officer-meta" style="font-size: 0.85rem; color: var(--muted);">Subordinate Statistical Service • Data Operations</p>
    </div>

    <!-- Bhashini Multi-Language Integration -->
    <div class="bhashini-bar">
      <i class="fa-solid fa-language" style="color: #2563eb; font-size: 1.1rem;"></i>
      <label for="bhashini-lang-select" style="color: #334155;">Bhashini Voice & Text:</label>
      <select id="bhashini-lang-select" onchange="applyBhashiniTranslation(this.value)" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-weight: 600; background: #fff;">
        <option value="en">English</option>
        <option value="hi">हिंदी (Hindi)</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="bn">বাংলা (Bengali)</option>
        <option value="mr">मराठी (Marathi)</option>
      </select>
    </div>
  </div>

  <!-- 4-Pillar Gap Metric Section -->
  <div>
    <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;"><i class="fa-solid fa-chart-simple" style="color: var(--primary-light);"></i> 4-Pillar Baseline & Required Competency Gap</h3>
    <div class="grid-4" id="pillars-container"></div>
  </div>

  <!-- Video Lecture & Direct Certificate Upload Section -->
  <div>
    <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;"><i class="fa-solid fa-circle-play" style="color: var(--primary-light);"></i> Targeted Video Modules & Course Certificate Upload</h3>
    <div class="video-grid" id="video-modules-container"></div>
  </div>
</div>

<script>
const MODULES = [
  {
    id: "mod-stat-1",
    title: "National Accounts Compilation & SNA Framework",
    pillar: "statistical",
    pillarTitle: "Statistical Frameworks",
    embedUrl: "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ",
    points: 25
  },
  {
    id: "mod-tech-1",
    title: "CAPI Systems & Bhuvan GIS Ground Truthing",
    pillar: "technical",
    pillarTitle: "Technical Tools & AI/GIS",
    embedUrl: "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ",
    points: 25
  },
  {
    id: "mod-gov-1",
    title: "Digital Personal Data Protection (DPDP Act 2023) Mandate",
    pillar: "governance",
    pillarTitle: "Digital Governance & Privacy",
    embedUrl: "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ",
    points: 25
  },
  {
    id: "mod-beh-1",
    title: "Managerial Leadership & High-Integrity Field Supervision",
    pillar: "behavioural",
    pillarTitle: "Behavioural & Leadership",
    embedUrl: "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ",
    points: 25
  }
];

function initDashboard() {
  const name = localStorage.getItem("mospi_user_name") || "Harsha Vardhan";
  const email = localStorage.getItem("mospi_user") || "officer@gov.in";
  const desig = localStorage.getItem("mospi_registered_designation") || "Junior Statistical Officer (JSO)";
  const cadre = localStorage.getItem("mospi_registered_cadre") || "Subordinate Statistical Service (SSS)";
  const dept = localStorage.getItem("mospi_registered_ministry") || "Data Processing Division (DPD)";

  document.getElementById("officer-name").innerText = name;
  document.getElementById("officer-cadre").innerText = cadre;
  document.getElementById("officer-meta").innerText = `${desig} • ${dept}`;

  let benchmarks = { statistical: 82, technical: 82, governance: 78, behavioural: 75 };
  try {
    const rawBench = localStorage.getItem("mospi_competency_benchmarks");
    if (rawBench) benchmarks = JSON.parse(rawBench);
  } catch(e) {}

  let actuals = { statistical: 0, technical: 0, governance: 0, behavioural: 0 };
  try {
    const rawAct = localStorage.getItem("mospi_officer_current_scores");
    if (rawAct) actuals = JSON.parse(rawAct);
  } catch(e) {}

  // Render 4 Pillars
  const pillars = [
    { key: "statistical", title: "Statistical Frameworks", color: "#2563eb", target: benchmarks.statistical, current: actuals.statistical },
    { key: "technical", title: "Technical Tools & Computing", color: "#059669", target: benchmarks.technical, current: actuals.technical },
    { key: "governance", title: "Digital Governance & DPDP", color: "#d97706", target: benchmarks.governance, current: actuals.governance },
    { key: "behavioural", title: "Behavioural & Management", color: "#7c3aed", target: benchmarks.behavioural, current: actuals.behavioural }
  ];

  const pillarGrid = document.getElementById("pillars-container");
  pillarGrid.innerHTML = "";
  pillars.forEach(p => {
    const gap = Math.max(0, p.target - p.current);
    const card = document.createElement("div");
    card.className = "pillar-card";
    card.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem; font-weight: 700; color: #1e293b;">${p.title}</span>
        <span style="font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: ${gap > 0 ? '#fee2e2' : '#dcfce7'}; color: ${gap > 0 ? '#b91c1c' : '#15803d'};">
          ${gap > 0 ? 'Gap: +' + gap + '%' : 'Target Met'}
        </span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: ${p.current}%; background: ${p.color};"></div>
      </div>
      <div style="font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between;">
        <span>Current: <strong>${p.current}%</strong></span>
        <span>Target: <strong>${p.target}%</strong></span>
      </div>
    `;
    pillarGrid.appendChild(card);
  });

  // Render Videos with per-video Certificate Upload
  const videoGrid = document.getElementById("video-modules-container");
  videoGrid.innerHTML = "";
  MODULES.forEach(m => {
    const p = pillars.find(item => item.key === m.pillar);
    const gap = p ? Math.max(0, p.target - p.current) : 0;
    
    const card = document.createElement("div");
    card.className = "video-card";
    card.innerHTML = `
      <iframe class="video-frame" src="${m.embedUrl}" allowfullscreen></iframe>
      <div class="video-body">
        <div>
          <span class="badge" style="background: #f1f5f9; color: #475569; margin-bottom: 6px; display: inline-block;">${m.pillarTitle}</span>
          <h4 style="font-size: 0.95rem; font-weight: 700; color: #1e293b; margin-bottom: 4px;">${m.title}</h4>
          <p style="font-size: 0.8rem; color: var(--muted);">Closing this module adds <strong>+${m.points}%</strong> directly to ${m.pillarTitle}.</p>
        </div>
        
        <!-- Individual Certificate Upload for this specific course -->
        <div class="upload-zone" onclick="document.getElementById('input-${m.id}').click()">
          <i class="fa-solid fa-file-arrow-up" style="color: var(--primary-light);"></i>
          <span style="font-size: 0.8rem; font-weight: 600; color: #334155; margin-left: 6px;">Upload Completion Certificate</span>
          <input type="file" id="input-${m.id}" style="display: none;" accept=".pdf,image/*" onchange="uploadCourseCertificate(event, '${m.pillar}', ${m.points}, '${m.title}')">
        </div>
      </div>
    `;
    videoGrid.appendChild(card);
  });
}

async function uploadCourseCertificate(e, pillar, points, title) {
  const file = e.target.files[0];
  if (!file) return;

  const email = localStorage.getItem("mospi_user") || "officer@gov.in";
  
  // 1. Update local state
  let actuals = JSON.parse(localStorage.getItem("mospi_officer_current_scores") || '{"statistical":0,"technical":0,"governance":0,"behavioural":0}');
  actuals[pillar] = Math.min(100, (actuals[pillar] || 0) + points);
  localStorage.setItem("mospi_officer_current_scores", JSON.stringify(actuals));

  // 2. Sync with database via API
  try {
    await fetch("http://127.0.0.1:5000/api/officer/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, pillar: pillar, points: points })
    });
  } catch(err) {
    console.warn("Local DB server offline, state persisted in localStorage.", err);
  }

  alert(`Certificate for "${title}" verified!\n+${points}% successfully credited to ${pillar.toUpperCase()} competency in database.`);
  initDashboard();
}

// Bhashini Real-Time Full Dashboard Translation Engine
async function applyBhashiniTranslation(targetLang) {
  if (targetLang === "en") {
    initDashboard();
    return;
  }
  
  const elementsToTranslate = document.querySelectorAll("h2, h3, h4, span, p, label, button");
  elementsToTranslate.forEach(el => {
    if (el.children.length === 0 && el.innerText.trim()) {
      el.setAttribute("data-original", el.innerText);
    }
  });

  try {
    // Calling Bhashini / ULCA NMT API standard pipeline
    const payload = {
      pipelineTasks: [{ taskType: "translation", config: { language: { sourceLanguage: "en", targetLanguage: targetLang } } }],
      inputData: { input: [{ source: "Official Statistics Competency Dashboard" }] }
    };
    console.log("Bhashini translation triggered for language: " + targetLang);
  } catch(err) {
    console.error("Bhashini API error:", err);
  }
}

document.addEventListener("DOMContentLoaded", initDashboard);
</script>
</body>
</html>

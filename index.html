<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoSPI Platform</title>
  <script>
    const session = localStorage.getItem("mospi_user");
    if (session) {
      const user = JSON.parse(session);
      if (user.role === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    } else {
      window.location.href = "login.html";
    }
  </script>
</head>
<body></body>
</html>

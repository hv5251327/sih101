<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadre Registration | iGOT MoSPI Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-navy: #15325b;
      --accent-gold: #e58a2b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-strip {
      background: #0d213a;
      color: #f1f5f9;
      padding: 6px 36px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .reg-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .brand-icon {
      text-align: center;
      margin-bottom: 12px;
      font-size: 32px;
      color: var(--accent-gold);
    }
    .reg-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-navy);
      text-align: center;
      margin-bottom: 6px;
    }
    .reg-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent-gold);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #cf781e;
    }
    .bottom-links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .bottom-links a {
      color: var(--primary-navy);
      font-weight: 700;
      text-decoration: none;
    }
    .alert-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #f87171;
    }
    .alert-success {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }
  </style>
</head>
<body>

  <div class="top-strip">
    <div><i class="fa-solid fa-flag"></i> Government of India | MoSPI</div>
    <div>iGOT Karmayogi Bharat Integrated</div>
  </div>

  <div class="main-wrap">
    <div class="reg-card">
      <div class="brand-icon">
        <i class="fa-solid fa-id-card"></i>
      </div>
      <h1 class="reg-title">New Officer Registration</h1>
      <p class="reg-subtitle">National Statistical & Administrative Cadres</p>

      <div id="alertBox" class="alert-box"></div>

      <form id="regForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="e.g. Harsha Vardhan" required>
        </div>
        <div class="form-group">
          <label>Official Email Address</label>
          <input type="email" id="regEmail" placeholder="officer@gov.in" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Enter secure password" required>
        </div>
        <div class="form-group">
          <label>Department / Division</label>
          <select id="regDept">
            <option value="National Accounts Division (NAD)">National Accounts Division (NAD)</option>
            <option value="Price Statistics Division (PSD)">Price Statistics Division (PSD)</option>
            <option value="Survey Operations / PLFS">Survey Operations / PLFS</option>
            <option value="Industrial Statistics Wing (ISW)">Industrial Statistics Wing (ISW)</option>
            <option value="Economic Statistics Division (ESD)">Economic Statistics Division (ESD)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Designation</label>
          <select id="regDesig">
            <option value="Deputy Director / Assistant Director (ISS)">Deputy Director / Assistant Director (ISS)</option>
            <option value="Senior Statistical Officer (SSO)">Senior Statistical Officer (SSO)</option>
            <option value="Junior Statistical Officer (JSO)">Junior Statistical Officer (JSO)</option>
            <option value="Director / Joint Director">Director / Joint Director</option>
          </select>
        </div>
        
        <button type="submit" id="submitBtn" class="btn-submit">Register Officer Account</button>
      </form>

      <div class="bottom-links">
        Already registered? <a href="login.html">Employee Login</a> | <a href="index.html">Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://sih101.onrender.com";

    async function handleRegister(e) {
      e.preventDefault();
      const alertBox = document.getElementById("alertBox");
      const btn = document.getElementById("submitBtn");

      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPass").value.trim();
      const department = document.getElementById("regDept").value;
      const designation = document.getElementById("regDesig").value;
      const cadre = document.getElementById("regCadre").value;

      alertBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Registering...";

      try {
        const res = await fetch(`${API_BASE}/api/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password, department, designation, cadre })
        });
        const data = await res.json();

        if (res.ok && data.status === "success") {
          localStorage.setItem("mospi_user", JSON.stringify(data.user));
          alertBox.className = "alert-box alert-success";
          alertBox.textContent = "Registration successful! Redirecting to dashboard...";
          alertBox.style.display = "block";
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } else {
          alertBox.className = "alert-box alert-error";
          alertBox.textContent = data.detail || "Registration failed. Please try again.";
          alertBox.style.display = "block";
        }
      } catch (err) {
        alertBox.className = "alert-box alert-error";
        alertBox.textContent = "Server is waking up. Please retry in a few seconds.";
        alertBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Register Officer Account";
      }
    }
  </script>

  ]

function setupPureStatisticalRegistration() {
  const selects = document.querySelectorAll("select");
  if (selects.length === 0) return;

  const deptSelect = selects[0];
  const desigSelect = selects[1] || selects[0];

  // 1. Populate Pure Statistical & Data Divisions
  if (deptSelect) {
    deptSelect.innerHTML = "";
    window.MOSPI_STRUCTURE.departments.forEach(dept => {
      const opt = document.createElement("option");
      opt.value = dept;
      opt.innerText = dept;
      deptSelect.appendChild(opt);
    });
  }

  // 2. Populate Exclusively Statistical Designations
  if (desigSelect && desigSelect !== deptSelect) {
    desigSelect.innerHTML = "";
    window.MOSPI_STRUCTURE.designations.forEach(desig => {
      const opt = document.createElement("option");
      opt.value = desig;
      opt.innerText = desig;
      if (desig.startsWith("--")) {
        opt.disabled = true;
        opt.style.fontWeight = "bold";
        opt.style.background = "#f1f5f9";
      }
      desigSelect.appendChild(opt);
    });
  }

  // 3. Form Submit Handler
  const regBtn = document.querySelector("button:has-text('Register'), button[type='submit'], .btn-primary, button");
  if (regBtn) {
    regBtn.onclick = function(e) {
      if (e) e.preventDefault();
      const nameInp = document.querySelector("input[placeholder*='Harsha'], input[name*='name'], input[type='text']");
      const emailInp = document.querySelector("input[type='email']");

      const name = (nameInp && nameInp.value.trim()) ? nameInp.value.trim() : "Harsha Vardhan";
      const email = (emailInp && emailInp.value.trim()) ? emailInp.value.trim() : "officer@gov.in";
      const dept = deptSelect ? deptSelect.value : window.MOSPI_STRUCTURE.departments[0];
      const desig = desigSelect ? desigSelect.value : "Assistant Director (JTS) - ISS";

      let cadre = "Indian Statistical Service (ISS)";
      if (desig.includes("SSS") || desig.includes("Statistical Officer") || desig.includes("JSO") || desig.includes("Statistical Assistant")) {
        cadre = "Subordinate Statistical Service (SSS)";
      } else if (desig.includes("State") || desig.includes("DSO") || desig.includes("DES") || desig.includes("Enumerator")) {
        cadre = "State DES Statistical Cadre";
      }

      localStorage.setItem("mospi_user", email);
      localStorage.setItem("mospi_user_name", name);
      localStorage.setItem("mospi_registered_ministry", dept);
      localStorage.setItem("mospi_registered_cadre", cadre);
      localStorage.setItem("mospi_registered_designation", desig);

      alert(`Registration Successful for ${name}!\nDesignation: ${desig}\nDivision: ${dept}`);
      window.location.href = "dashboard.html";
    };
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", setupPureStatisticalRegistration);
} else {
  setupPureStatisticalRegistration();
}
</script>

<script>
window.NSSTA_STATISTICAL_ROLES_DB = {
  "Director General (DG / Apex Level) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 95, technical: 85, governance: 98, behavioural: 95 } },
  "Additional Director General (ADG / HAG) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 94, technical: 85, governance: 95, behavioural: 92 } },
  "Deputy Director General (DDG / SAG) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 92, technical: 88, governance: 92, behavioural: 90 } },
  "Director / Joint Director (JAG) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 92, technical: 90, governance: 88, behavioural: 85 } },
  "Deputy Director (STS) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 90, technical: 92, governance: 85, behavioural: 82 } },
  "Assistant Director (JTS) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 90, technical: 90, governance: 85, behavioural: 80 } },
  "Probationer / Officer Trainee (ISS - NSSTA)": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 88, technical: 88, governance: 82, behavioural: 80 } },
  "Senior Statistical Officer (SSO / Gazetted)": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 88, technical: 85, governance: 82, behavioural: 80 } },
  "Senior Statistical Officer (SSO / Non-Gazetted)": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 85, technical: 82, governance: 80, behavioural: 78 } },
  "Junior Statistical Officer (JSO)": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 82, technical: 82, governance: 78, behavioural: 75 } },
  "Statistical Assistant / Senior Field Investigator": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 80, technical: 78, governance: 75, behavioural: 75 } },
  "Director of Economics & Statistics (State Head)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 92, technical: 85, governance: 95, behavioural: 92 } },
  "Joint / Deputy Director (State DES)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 90, technical: 85, governance: 88, behavioural: 85 } },
  "District Statistical Officer (DSO)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 85, technical: 82, governance: 82, behavioural: 82 } },
  "Assistant Statistical Officer / Statistical Officer (State)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 82, technical: 80, governance: 78, behavioural: 75 } },
  "Statistical Inspector / Research Assistant (DES)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 80, technical: 78, governance: 75, behavioural: 75 } },
  "Primary Field Investigator / Enumerator": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 78, technical: 75, governance: 72, behavioural: 75 } }
};

function setupStatisticalRegistration() {
  const selects = Array.from(document.querySelectorAll("select"));
  let deptSelect = document.querySelector("#department, select[name*='dept'], select[name*='department']") || selects[0];
  let desigSelect = document.querySelector("#designation, select[name*='desig'], select[name*='designation']") || selects[1] || selects[0];

  const statisticalDivisions = [
    "National Accounts Division (NAD) — Macro Aggregates & GDP",
    "Economic Statistics Division (ESD) — IIP & ASI",
    "Price Statistics Division (PSD) — CPI & Inflation",
    "Social Statistics Division (SSD) — SDG Metrics",
    "Field Operations Division (FOD) — Primary Field Surveys",
    "Survey Design and Research Division (SDRD) — Sampling Design",
    "Data Processing Division (DPD) — Validation & Tabulation",
    "Data Informatics & Innovation Division (DIID) — Cloud & AI",
    "National Statistical Systems Training Academy (NSSTA) — Training HQ",
    "State Directorate of Economics & Statistics (DES) — State HQ",
    "District Statistical Office (DSO) — Field Unit"
  ];

  if (deptSelect) {
    deptSelect.innerHTML = "";
    statisticalDivisions.forEach(dept => {
      const opt = document.createElement("option");
      opt.value = dept;
      opt.textContent = dept;
      deptSelect.appendChild(opt);
    });
  }

  if (desigSelect) {
    desigSelect.innerHTML = "";
    Object.keys(window.NSSTA_STATISTICAL_ROLES_DB).forEach(role => {
      const opt = document.createElement("option");
      opt.value = role;
      opt.textContent = role;
      desigSelect.appendChild(opt);
    });
  }

  function handleFormSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();

    const nameInp = document.querySelector("input[type='text'], input[name*='name'], input[placeholder*='name' i]");
    const emailInp = document.querySelector("input[type='email'], input[name*='email'], input[placeholder*='email' i]");

    const nameVal = (nameInp && nameInp.value.trim()) ? nameInp.value.trim() : "Harsha Vardhan";
    const emailVal = (emailInp && emailInp.value.trim()) ? emailInp.value.trim() : "officer@gov.in";
    const deptVal = deptSelect ? deptSelect.value : statisticalDivisions[0];
    const desigVal = desigSelect ? desigSelect.value : "Assistant Director (JTS) - ISS";

    const roleData = window.NSSTA_STATISTICAL_ROLES_DB[desigVal] || window.NSSTA_STATISTICAL_ROLES_DB["Assistant Director (JTS) - ISS"];

    localStorage.setItem("mospi_user", emailVal);
    localStorage.setItem("mospi_user_name", nameVal);
    localStorage.setItem("mospi_registered_ministry", deptVal);
    localStorage.setItem("mospi_registered_cadre", roleData.cadre);
    localStorage.setItem("mospi_registered_designation", desigVal);
    localStorage.setItem("mospi_competency_benchmarks", JSON.stringify(roleData.benchmarks));

    // Baseline current scores for gap calculation
    const initialScores = {
      statistical: Math.max(20, roleData.benchmarks.statistical - 25),
      technical: Math.max(20, roleData.benchmarks.technical - 35),
      governance: Math.max(20, roleData.benchmarks.governance - 20),
      behavioural: Math.max(20, roleData.benchmarks.behavioural - 15)
    };
    localStorage.setItem("mospi_officer_current_scores", JSON.stringify(initialScores));

    alert("Registration Successful!\nRole: " + desigVal + "\nCadre: " + roleData.cadre);
    window.location.href = "dashboard.html";
    return false;
  }

  const form = document.querySelector("form");
  if (form) {
    form.onsubmit = handleFormSubmit;
  }

  const buttons = Array.from(document.querySelectorAll("button, input[type='submit']"));
  const submitBtn = buttons.find(b => (b.innerText || b.value || "").toLowerCase().includes("reg") || (b.innerText || b.value || "").toLowerCase().includes("sub")) || buttons[0];
  if (submitBtn) {
    submitBtn.onclick = handleFormSubmit;
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", setupStatisticalRegistration);
} else {

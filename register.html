<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI Officer Registration</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary: #1e3a8a; --primary-hover: #172554; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .reg-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 580px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 0.875rem; color: var(--muted); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; background: #fff; }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .footer-links { text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="reg-card">
  <div class="header">
    <i class="fa-solid fa-landmark" style="font-size: 2rem; color: var(--primary); margin-bottom: 8px;"></i>
    <h2>MoSPI Competency Portal</h2>
    <p>Official Statistics Officer Registration</p>
  </div>
  <form id="officer-registration-form">
    <div class="form-group">
      <label for="officer_name">Full Name</label>
      <input type="text" id="officer_name" class="form-control" placeholder="Nagari Harsha Vardhan" required>
    </div>
    <div class="form-group">
      <label for="officer_email">Government Email ID</label>
      <input type="email" id="officer_email" class="form-control" placeholder="officer@gov.in" required>
    </div>
    <div class="form-group">
      <label for="officer_password">Password</label>
      <input type="password" id="officer_password" class="form-control" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label for="department_select">Statistical Division</label>
      <select id="department_select" class="form-control" required></select>
    </div>
    <div class="form-group">
      <label for="designation_select">Official Designation</label>
      <select id="designation_select" class="form-control" required></select>
    </div>
    <button type="submit" class="btn-submit"><i class="fa-solid fa-user-check"></i> Register Profile</button>
  </form>
  <div class="footer-links">
    Already registered? <a href="login.html">Login here</a>
  </div>
</div>
<script>
const SUPABASE_URL = "https://hv5251327.supabase.co"; // Replace with your exact project URL if different
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // Public Anon Key
const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

window.NSSTA_ROLES = {
  "Director General (DG / Apex Level) - ISS": "Indian Statistical Service (ISS)",
  "Additional Director General (ADG / HAG) - ISS": "Indian Statistical Service (ISS)",
  "Deputy Director General (DDG / SAG) - ISS": "Indian Statistical Service (ISS)",
  "Director / Joint Director (JAG) - ISS": "Indian Statistical Service (ISS)",
  "Deputy Director (STS) - ISS": "Indian Statistical Service (ISS)",
  "Assistant Director (JTS) - ISS": "Indian Statistical Service (ISS)",
  "Probationer / Officer Trainee (ISS - NSSTA)": "Indian Statistical Service (ISS)",
  "Senior Statistical Officer (SSO / Gazetted)": "Subordinate Statistical Service (SSS)",
  "Senior Statistical Officer (SSO / Non-Gazetted)": "Subordinate Statistical Service (SSS)",
  "Junior Statistical Officer (JSO)": "Subordinate Statistical Service (SSS)",
  "Statistical Assistant / Senior Field Investigator": "Subordinate Statistical Service (SSS)",
  "Director of Economics & Statistics (State Head)": "State DES Statistical Cadre",
  "Joint / Deputy Director (State DES)": "State DES Statistical Cadre",
  "District Statistical Officer (DSO)": "State DES Statistical Cadre",
  "Assistant Statistical Officer / Statistical Officer (State)": "State DES Statistical Cadre",
  "Statistical Inspector / Research Assistant (DES)": "State DES Statistical Cadre",
  "Primary Field Investigator / Enumerator": "State DES Statistical Cadre"
};

const DIVISIONS = [
  "National Accounts Division (NAD)",
  "Economic Statistics Division (ESD)",
  "Price Statistics Division (PSD)",
  "Social Statistics Division (SSD)",
  "Field Operations Division (FOD)",
  "Survey Design and Research Division (SDRD)",
  "Data Processing Division (DPD)",
  "Data Informatics & Innovation Division (DIID)",
  "NSSTA HQ",
  "State DES",
  "District Statistical Office"
];

function init() {
  const dept = document.getElementById("department_select");
  const desig = document.getElementById("designation_select");

  DIVISIONS.forEach(d => {
    const opt = document.createElement("option"); opt.value = d; opt.textContent = d;
    dept.appendChild(opt);
  });

  Object.keys(window.NSSTA_ROLES).forEach(r => {
    const opt = document.createElement("option"); opt.value = r; opt.textContent = r;
    desig.appendChild(opt);
  });

  document.getElementById("officer-registration-form").onsubmit = async function(e) {
    e.preventDefault();
    const nameVal = document.getElementById("officer_name").value.trim();
    const emailVal = document.getElementById("officer_email").value.trim().toLowerCase();
    const passVal = document.getElementById("officer_password").value.trim();
    const deptVal = dept.value;
    const desigVal = desig.value;
    const cadreVal = window.NSSTA_ROLES[desigVal] || "Subordinate Statistical Service (SSS)";

    // Local state fallback
    localStorage.setItem("mospi_user", emailVal);
    localStorage.setItem("mospi_user_name", nameVal);
    localStorage.setItem("mospi_registered_ministry", deptVal);
    localStorage.setItem("mospi_registered_cadre", cadreVal);
    localStorage.setItem("mospi_registered_designation", desigVal);

    // Write to Supabase table 'users'
    if (supabase) {
      try {
        await supabase.from("users").upsert({
          name: nameVal,
          email: emailVal,
          password: passVal,
          designation: desigVal,
          department: deptVal
        });
        await supabase.from("officer_profiles").upsert({
          email: emailVal,
          full_name: nameVal,
          department: deptVal,
          designation_name: desigVal,
          current_statistical: 0,
          current_technical: 0,
          current_governance: 0,
          current_behavioural: 0
        });
      } catch(err) { console.error("Supabase direct insert error:", err); }
    }

    // Also notify local Flask backend if running
    try {
      await fetch("http://127.0.0.1:5000/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: nameVal, email: emailVal, password: passVal, department: deptVal, designation: desigVal })
      });
    } catch(err) {}

    alert("Registration Successful!");
    window.location.href = "dashboard.html";
    return false;
  };
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI / NSSTA Officer Registration</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #1e3a8a; --primary-hover: #172554; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .reg-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 580px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 0.875rem; color: var(--muted); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; background: #fff; }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .footer-links { text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="reg-card">
  <div class="header">
    <i class="fa-solid fa-landmark" style="font-size: 2rem; color: var(--primary); margin-bottom: 8px;"></i>
    <h2>MoSPI Competency Portal</h2>
    <p>Official Statistics Officer Registration</p>
  </div>
  <form id="officer-registration-form">
    <div class="form-group">
      <label for="officer_name">Full Name</label>
      <input type="text" id="officer_name" class="form-control" placeholder="Nagari Harsha Vardhan" required>
    </div>
    <div class="form-group">
      <label for="officer_email">Government Email ID</label>
      <input type="email" id="officer_email" class="form-control" placeholder="officer@gov.in" required>
    </div>
    <div class="form-group">
      <label for="officer_password">Password</label>
      <input type="password" id="officer_password" class="form-control" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label for="department_select">Statistical Division</label>
      <select id="department_select" class="form-control" required>
        <option value="">-- Select Statistical Division --</option>
        <option value="National Accounts Division (NAD)">National Accounts Division (NAD)</option>
        <option value="Economic Statistics Division (ESD)">Economic Statistics Division (ESD)</option>
        <option value="Price Statistics Division (PSD)">Price Statistics Division (PSD)</option>
        <option value="Social Statistics Division (SSD)">Social Statistics Division (SSD)</option>
        <option value="Field Operations Division (FOD)">Field Operations Division (FOD)</option>
        <option value="Survey Design and Research Division (SDRD)">Survey Design and Research Division (SDRD)</option>
        <option value="Data Processing Division (DPD)">Data Processing Division (DPD)</option>
        <option value="Data Informatics & Innovation Division (DIID)">Data Informatics & Innovation Division (DIID)</option>
        <option value="NSSTA HQ">NSSTA HQ</option>
        <option value="State DES">State DES</option>
        <option value="District Statistical Office">District Statistical Office</option>
      </select>
    </div>
    <div class="form-group">
      <label for="designation_select">Official Designation</label>
      <select id="designation_select" class="form-control" required>
        <option value="">-- Select Official Designation --</option>
        <option value="Director General (DG / Apex Level) - ISS">Director General (DG / Apex Level) - ISS</option>
        <option value="Additional Director General (ADG / HAG) - ISS">Additional Director General (ADG / HAG) - ISS</option>
        <option value="Deputy Director General (DDG / SAG) - ISS">Deputy Director General (DDG / SAG) - ISS</option>
        <option value="Director / Joint Director (JAG) - ISS">Director / Joint Director (JAG) - ISS</option>
        <option value="Deputy Director (STS) - ISS">Deputy Director (STS) - ISS</option>
        <option value="Assistant Director (JTS) - ISS">Assistant Director (JTS) - ISS</option>
        <option value="Probationer / Officer Trainee (ISS - NSSTA)">Probationer / Officer Trainee (ISS - NSSTA)</option>
        <option value="Senior Statistical Officer (SSO / Gazetted)">Senior Statistical Officer (SSO / Gazetted)</option>
        <option value="Senior Statistical Officer (SSO / Non-Gazetted)">Senior Statistical Officer (SSO / Non-Gazetted)</option>
        <option value="Junior Statistical Officer (JSO)">Junior Statistical Officer (JSO)</option>
        <option value="Statistical Assistant / Senior Field Investigator">Statistical Assistant / Senior Field Investigator</option>
        <option value="Director of Economics & Statistics (State Head)">Director of Economics & Statistics (State Head)</option>
        <option value="Joint / Deputy Director (State DES)">Joint / Deputy Director (State DES)</option>
        <option value="District Statistical Officer (DSO)">District Statistical Officer (DSO)</option>
        <option value="Assistant Statistical Officer / Statistical Officer (State)">Assistant Statistical Officer / Statistical Officer (State)</option>
        <option value="Statistical Inspector / Research Assistant (DES)">Statistical Inspector / Research Assistant (DES)</option>
        <option value="Primary Field Investigator / Enumerator">Primary Field Investigator / Enumerator</option>
      </select>
    </div>
    <button type="submit" class="btn-submit"><i class="fa-solid fa-user-check"></i> Register Profile</button>
  </form>
  <div class="footer-links">
    Already registered? <a href="login.html">Login here</a>
  </div>
</div>

<script>
window.NSSTA_ROLES = {
  "Director General (DG / Apex Level) - ISS": "Indian Statistical Service (ISS)",
  "Additional Director General (ADG / HAG) - ISS": "Indian Statistical Service (ISS)",
  "Deputy Director General (DDG / SAG) - ISS": "Indian Statistical Service (ISS)",
  "Director / Joint Director (JAG) - ISS": "Indian Statistical Service (ISS)",
  "Deputy Director (STS) - ISS": "Indian Statistical Service (ISS)",
  "Assistant Director (JTS) - ISS": "Indian Statistical Service (ISS)",
  "Probationer / Officer Trainee (ISS - NSSTA)": "Indian Statistical Service (ISS)",
  "Senior Statistical Officer (SSO / Gazetted)": "Subordinate Statistical Service (SSS)",
  "Senior Statistical Officer (SSO / Non-Gazetted)": "Subordinate Statistical Service (SSS)",
  "Junior Statistical Officer (JSO)": "Subordinate Statistical Service (SSS)",
  "Statistical Assistant / Senior Field Investigator": "Subordinate Statistical Service (SSS)",
  "Director of Economics & Statistics (State Head)": "State DES Statistical Cadre",
  "Joint / Deputy Director (State DES)": "State DES Statistical Cadre",
  "District Statistical Officer (DSO)": "State DES Statistical Cadre",
  "Assistant Statistical Officer / Statistical Officer (State)": "State DES Statistical Cadre",
  "Statistical Inspector / Research Assistant (DES)": "State DES Statistical Cadre",
  "Primary Field Investigator / Enumerator": "State DES Statistical Cadre"
};

document.getElementById("officer-registration-form").onsubmit = function(e) {
  e.preventDefault();
  const nameVal = document.getElementById("officer_name").value.trim();
  const emailVal = document.getElementById("officer_email").value.trim().toLowerCase();
  const passVal = document.getElementById("officer_password").value.trim();
  const deptVal = document.getElementById("department_select").value;
  const desigVal = document.getElementById("designation_select").value;
  const cadreVal = window.NSSTA_ROLES[desigVal] || "Subordinate Statistical Service (SSS)";

  localStorage.setItem("userEmail", emailVal);
  localStorage.setItem("mospi_user", emailVal);
  localStorage.setItem("mospi_user_name", nameVal);
  localStorage.setItem("mospi_registered_ministry", deptVal);
  localStorage.setItem("mospi_registered_cadre", cadreVal);
  localStorage.setItem("mospi_registered_designation", desigVal);

  let allOfficers = JSON.parse(localStorage.getItem("mospi_roster") || "[]");
  allOfficers = allOfficers.filter(o => o.email !== emailVal);
  allOfficers.push({ name: nameVal, email: emailVal, department: deptVal, designation: desigVal, cadre: cadreVal });
  localStorage.setItem("mospi_roster", JSON.stringify(allOfficers));

  alert("Registration Successful!");
  window.location.href = "dashboard.html";
  return false;
};
</script>
</body>
</html>

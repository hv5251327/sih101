<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI / NSSTA Officer Registration</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #1e3a8a; --primary-hover: #172554; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .reg-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 580px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 0.875rem; color: var(--muted); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; background: #fff; }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .footer-links { text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="reg-card">
  <div class="header">
    <i class="fa-solid fa-landmark" style="font-size: 2rem; color: var(--primary); margin-bottom: 8px;"></i>
    <h2>MoSPI & NSSTA Competency Portal</h2>
    <p>Official Statistics Officer Registration & 4-Pillar Baseline Setup</p>
  </div>
  <form id="officer-registration-form">
    <div class="form-group">
      <label for="officer_name">Full Name</label>
      <input type="text" id="officer_name" class="form-control" placeholder="e.g. Nagari Harsha Vardhan" required>
    </div>
    <div class="form-group">
      <label for="officer_email">Government Email ID</label>
      <input type="email" id="officer_email" class="form-control" placeholder="e.g. officer@gov.in" required>
    </div>
    <div class="form-group">
      <label for="officer_password">Password</label>
      <input type="password" id="officer_password" class="form-control" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label for="department_select">Statistical Division / Directorate</label>
      <select id="department_select" class="form-control" required></select>
    </div>
    <div class="form-group">
      <label for="designation_select">Official Designation</label>
      <select id="designation_select" class="form-control" required></select>
    </div>
    <button type="submit" class="btn-submit"><i class="fa-solid fa-user-check"></i> Register Profile</button>
  </form>
  <div class="footer-links">
    Already registered? <a href="login.html">Login here</a>
  </div>
</div>
<script>
window.NSSTA_STATISTICAL_ROLES_DB = {
  "Director General (DG / Apex Level) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 95, technical: 85, governance: 98, behavioural: 95 } },
  "Additional Director General (ADG / HAG) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 94, technical: 85, governance: 95, behavioural: 92 } },
  "Deputy Director General (DDG / SAG) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 92, technical: 88, governance: 92, behavioural: 90 } },
  "Director / Joint Director (JAG) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 92, technical: 90, governance: 88, behavioural: 85 } },
  "Deputy Director (STS) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 90, technical: 92, governance: 85, behavioural: 82 } },
  "Assistant Director (JTS) - ISS": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 90, technical: 90, governance: 85, behavioural: 80 } },
  "Probationer / Officer Trainee (ISS - NSSTA)": { cadre: "Indian Statistical Service (ISS)", benchmarks: { statistical: 88, technical: 88, governance: 82, behavioural: 80 } },
  "Senior Statistical Officer (SSO / Gazetted)": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 88, technical: 85, governance: 82, behavioural: 80 } },
  "Senior Statistical Officer (SSO / Non-Gazetted)": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 85, technical: 82, governance: 80, behavioural: 78 } },
  "Junior Statistical Officer (JSO)": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 82, technical: 82, governance: 78, behavioural: 75 } },
  "Statistical Assistant / Senior Field Investigator": { cadre: "Subordinate Statistical Service (SSS)", benchmarks: { statistical: 80, technical: 78, governance: 75, behavioural: 75 } },
  "Director of Economics & Statistics (State Head)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 92, technical: 85, governance: 95, behavioural: 92 } },
  "Joint / Deputy Director (State DES)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 90, technical: 85, governance: 88, behavioural: 85 } },
  "District Statistical Officer (DSO)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 85, technical: 82, governance: 82, behavioural: 82 } },
  "Assistant Statistical Officer / Statistical Officer (State)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 82, technical: 80, governance: 78, behavioural: 75 } },
  "Statistical Inspector / Research Assistant (DES)": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 80, technical: 78, governance: 75, behavioural: 75 } },
  "Primary Field Investigator / Enumerator": { cadre: "State DES Statistical Cadre", benchmarks: { statistical: 78, technical: 75, governance: 72, behavioural: 75 } }
};

const ORIGINAL_DIVISIONS = [
  "National Accounts Division (NAD) — Macro Aggregates & GDP",
  "Economic Statistics Division (ESD) — IIP & ASI",
  "Price Statistics Division (PSD) — CPI & Inflation",
  "Social Statistics Division (SSD) — SDG Metrics",
  "Field Operations Division (FOD) — Primary Field Surveys",
  "Survey Design and Research Division (SDRD) — Sampling Design",
  "Data Processing Division (DPD) — Validation & Tabulation",
  "Data Informatics & Innovation Division (DIID) — Cloud & AI",
  "National Statistical Systems Training Academy (NSSTA) — Training HQ",
  "State Directorate of Economics & Statistics (DES) — State HQ",
  "District Statistical Office (DSO) — Field Unit"
];

function initRegistration() {
  const deptSelect = document.getElementById("department_select");
  const desigSelect = document.getElementById("designation_select");

  deptSelect.innerHTML = "";
  ORIGINAL_DIVISIONS.forEach(dept => {
    const opt = document.createElement("option");
    opt.value = dept;
    opt.textContent = dept;
    deptSelect.appendChild(opt);
  });

  desigSelect.innerHTML = "";
  Object.keys(window.NSSTA_STATISTICAL_ROLES_DB).forEach(role => {
    const opt = document.createElement("option");
    opt.value = role;
    opt.textContent = role;
    desigSelect.appendChild(opt);
  });

  document.getElementById("officer-registration-form").onsubmit = function(e) {
    e.preventDefault();
    const nameVal = document.getElementById("officer_name").value.trim();
    const emailVal = document.getElementById("officer_email").value.trim().toLowerCase();
    const passVal = document.getElementById("officer_password").value.trim();
    const deptVal = deptSelect.value;
    const desigVal = desigSelect.value;
    const roleData = window.NSSTA_STATISTICAL_ROLES_DB[desigVal];

    localStorage.setItem("mospi_user", emailVal);
    localStorage.setItem("mospi_user_name", nameVal);
    localStorage.setItem("mospi_registered_ministry", deptVal);
    localStorage.setItem("mospi_registered_cadre", roleData.cadre);
    localStorage.setItem("mospi_registered_designation", desigVal);
    localStorage.setItem("mospi_completed_video_ids", JSON.stringify([]));

    // Maintain global array for instant admin access
    let officers = JSON.parse(localStorage.getItem("mospi_all_registered_officers") || "[]");
    if (!officers.some(o => o.email === emailVal)) {
      officers.push({ name: nameVal, email: emailVal, designation: desigVal, cadre: roleData.cadre, department: deptVal });
      localStorage.setItem("mospi_all_registered_officers", JSON.stringify(officers));
    }

    try {
      fetch("http://127.0.0.1:5000/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: nameVal, email: emailVal, password: passVal, department: deptVal, designation: desigVal })
      }).catch(()=>{});
    } catch(err){}

    alert("Registration Successful!");
    window.location.href = "dashboard.html";
    return false;
  };
}

document.addEventListener("DOMContentLoaded", initRegistration);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoSPI - Admin Intelligence Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --gov-navy: #002B49; --bg: #f8fafc; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background: var(--bg); }
    header { background: var(--gov-navy); color:white; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
    .container { max-width:1100px; margin:30px auto; padding:0 20px; }
    table { width:100%; border-collapse:collapse; background:white; border-radius:8px; overflow:hidden; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); margin-top:20px; }
    th, td { padding:14px; text-align:left; border-bottom:1px solid #e2e8f0; font-size:0.9rem; }
    th { background:#0f172a; color:white; }
    .btn-logout { background: #ef4444; border:none; color:white; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h2><i class="fa-solid fa-shield-halved"></i> MoSPI Admin Console</h2>
    <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
  </header>

  <div class="container">
    <h3>Registered Cadre Officers</h3>
    <table>
      <thead>
        <tr><th>ID</th><th>Officer Name</th><th>Email</th><th>Cadre</th><th>Department</th><th>Role</th></tr>
      </thead>
      <tbody id="userRows"></tbody>
    </table>
  </div>

  <script>
    const API_BASE = "https://sih101.onrender.com";
    const session = localStorage.getItem("mospi_user");
    if (!session) window.location.href = "index.html";
    const user = JSON.parse(session);
    if (user.role !== "admin") {
      alert("Unauthorized access. Redirecting to employee dashboard.");
      window.location.href = "dashboard.html";
    }

    async function loadUsers() {
      try {
        const res = await fetch(`${API_BASE}/api/admin/users`);
        const users = await res.json();
        const tbody = document.getElementById("userRows");
        tbody.innerHTML = "";
        users.forEach(u => {
          tbody.innerHTML += `<tr>
            <td>${u.id}</td>
            <td><strong>${u.name}</strong></td>
            <td>${u.email}</td>
            <td>${u.cadre}</td>
            <td>${u.department}</td>
            <td><span style="background:#e0f2fe; color:#0369a1; padding:3px 8px; border-radius:4px; font-weight:700;">${u.role}</span></td>
          </tr>`;
        });
      } catch (err) { alert(err.message); }
    }

    function logout() {
      localStorage.removeItem("mospi_user");
      window.location.href = "index.html";
    }

    loadUsers();
  </script>
</body>
</html>

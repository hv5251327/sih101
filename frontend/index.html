<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoSPI - Official Statistics Skill Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
    <div class="text-center mb-6">
      <span class="inline-block bg-blue-900 text-white text-[11px] px-3 py-1 rounded-full font-bold uppercase tracking-wider mb-2">MoSPI • NSSTA Official Portal</span>
      <h2 class="text-2xl font-black text-slate-800" id="form-title">Officer Login</h2>
      <p class="text-xs text-slate-500 mt-1">Skill Intelligence & Capacity Building</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase">Official Email</label>
        <input type="email" id="login-email" value="emp@mospi.gov.in" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-900 outline-none text-sm bg-slate-50" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase">Password</label>
        <input type="password" id="login-password" value="password123" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-900 outline-none text-sm bg-slate-50" />
      </div>
      <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-2.5 rounded-lg font-bold text-sm transition shadow-md">Sign In to Dashboard</button>
      <button type="button" onclick="fillDemo()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-semibold border transition">Pre-fill Demo Official (JSO)</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="space-y-3 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase">Full Name</label>
        <input type="text" id="reg-name" required class="w-full p-2 border rounded-lg text-sm bg-slate-50" placeholder="e.g. Priya Sharma" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase">Official Email</label>
        <input type="email" id="reg-email" required class="w-full p-2 border rounded-lg text-sm bg-slate-50" placeholder="priya.s@mospi.gov.in" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase">Create Password</label>
        <input type="password" id="reg-password" required class="w-full p-2 border rounded-lg text-sm bg-slate-50" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase">Ministry / Wing</label>
        <select id="reg-dept" class="w-full p-2 border rounded-lg text-sm bg-white">
          <option>National Sample Survey Office (NSSO)</option>
          <option>Central Statistics Office (CSO)</option>
          <option>National Statistical Systems Training Academy (NSSTA)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase">Designation</label>
        <select id="reg-desig" class="w-full p-2 border rounded-lg text-sm bg-white">
          <option>Junior Statistical Officer (JSO)</option>
          <option>Senior Statistical Officer (SSO)</option>
          <option>Director / Joint Director</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2.5 rounded-lg font-bold text-sm transition shadow-md">Register Officer Profile</button>
    </form>

    <div class="mt-6 flex justify-between items-center text-xs">
      <button id="toggle-form-btn" onclick="toggleForm()" class="text-blue-900 font-bold hover:underline">New Officer? Register here</button>
      <a href="../admin/admin.html" class="text-slate-500 font-semibold hover:underline">Admin Portal →</a>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Sign In | MoSPI iGOT Karmayogi</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15325b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #15325b;
      --accent: #e58a2b;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    .top-strip {
      background: #0d213a; color: #f1f5f9; padding: 8px 36px; font-size: 11px;
      display: flex; justify-content: space-between; align-items: center; font-weight: 500;
    }
    .main-wrapper {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 16px;
    }
    .auth-card {
      background: var(--card-bg); width: 100%; max-width: 420px; border-radius: 16px;
      padding: 36px 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid var(--border);
    }
    .brand-logo {
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;
    }
    .brand-logo i { font-size: 32px; color: var(--accent); }
    .brand-logo span { font-size: 18px; font-weight: 800; color: var(--primary); }

    .input-group { margin-bottom: 16px; }
    .input-label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .input-field {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--primary); }

    .btn-login {
      width: 100%; padding: 12px; background: var(--primary); color: white; border: none;
      border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover { background: #0e223f; }

    .auth-footer {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-muted); text-align: center;
    }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

  <div class="top-strip">
    <div><i class="fa-solid fa-flag"></i> Government of India | Ministry of Statistics & PI</div>
    <div>National Statistical Systems Training Academy (NSSTA)</div>
  </div>

  <div class="main-wrapper">
    <div class="auth-card">
      <div class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>MoSPI iGOT Portal</span>
      </div>

      <h2 style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 4px; text-align: center;">Officer Sign In</h2>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 22px; text-align: center;">Enter your cadre credentials or registered government email.</p>

      <form id="officerLoginForm" onsubmit="handleOfficerLogin(event)">
        <div class="input-group">
          <label class="input-label">Government Email ID</label>
          <input type="email" id="emailInput" class="input-field" placeholder="e.g. harsha@gov.in or officer@gov.in" value="harsha@gov.in" required>
        </div>

        <div class="input-group">
          <label class="input-label">Password / SSO PIN</label>
          <input type="password" id="passInput" class="input-field" placeholder="Enter password" value="1234" required>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-login">Sign In to Learning Dashboard</button>
      </form>

      <div class="auth-footer">
        <div>Need administrative access? <a href="admin.html">Go to Admin Portal</a></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://sih101.onrender.com";

    async function handleOfficerLogin(e) {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passInput").value.trim();
      const btn = document.getElementById("btnLoginSubmit");

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.status === "success") {
          localStorage.setItem("mospi_user", JSON.stringify(data.user));
          window.location.href = "dashboard.html";
        } else {
          alert(`Authentication Failed: ${data.detail || "Invalid credentials."}`);
        }
      } catch (err) {
        alert("Server connection failed. If you are offline, you can continue with local cache.");
        // Fallback local session if offline
        const localOfficer = {
          name: "Cadre Officer",
          email: email,
          department: "National Accounts Division (NAD)",
          designation: "Deputy Director / Assistant Director (ISS)",
          cadre: "Indian Statistical Service (ISS)",
          role: "employee",
          competency_score: "75%",
          completed_modules: [1, 2]
        };
        localStorage.setItem("mospi_user", JSON.stringify(localOfficer));
        window.location.href = "dashboard.html";
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Sign In to Learning Dashboard";
      }
    }
  </script>
</body>
</html>
